<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cosmic Strike</title><link rel="stylesheet" href="game.css"></head>
<body>
<canvas id="game-canvas" tabindex="0" aria-label="Cosmic Strike. Move with WASD or arrows, Space or mouse fires, Shift boosts, P pauses."></canvas>
<div id="hud"><div class="health"><label>HULL <span id="hp-label"></span></label><div class="bar"><i id="hp-fill"></i></div><label>SHIELD</label><div class="bar shield"><i id="shield-fill"></i></div><label>SPECIAL ENERGY</label><div class="bar energy"><i id="energy-fill"></i></div></div><div class="mission"><b id="wave-label"></b><small id="loadout"></small><div id="boss-bar-wrap" hidden><label id="boss-name"></label><div class="bar boss"><i id="boss-fill"></i></div></div></div><div class="score">SCORE <b id="hud-score">0</b><small id="hud-combo">×1</small><small id="hud-best">BEST 0</small><button id="mute" aria-label="Toggle sound">Sound off</button><button id="pause-btn">Pause</button></div></div>
<p id="guidance">WASD / arrows move · Hold Space or click to fire · Shift boosts</p>
<div id="screen-pause" class="overlay"><section><h1>PAUSED</h1><p id="pause-copy">Catch your breath.</p><button id="resume-btn">Resume</button></section></div>
<div id="result" class="overlay"><section><h1 id="result-title"></h1><p id="result-copy"></p><p>Use Restart above to retry this mission.</p></section></div>
<script src="js/utils.js"></script><script src="js/storage.js"></script><script src="js/audio.js"></script><script src="js/particles.js"></script><script src="js/bullets.js"></script><script src="js/weapons.js"></script><script src="js/player.js"></script><script src="js/powerups.js"></script><script src="js/enemies.js"></script><script src="js/bosses.js"></script><script src="js/levels.js"></script><script src="js/bridge.js"></script><script src="js/game.js"></script>
</body></html>
