<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Game</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#101319;color:#f4f5f7;font:16px system-ui,sans-serif;min-height:100vh}main{max-width:1000px;margin:auto;padding:48px 24px 80px}h1{font-size:clamp(2rem,5vw,3rem);margin:0 0 8px}p{color:#a7afbc;margin:0 0 34px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px}a{display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:#f4f5f7;background:#1a202b;border:1px solid #343c4a;border-radius:10px;min-height:78px;padding:18px;font-weight:650}a:hover,a:focus-visible{border-color:#a8b8d6;background:#243042;outline:none}span{color:#93a7c6}
  </style>
</head>
<body>
<main>
  <h1>Web Game</h1>
  <p>Choose a game to play.</p>
  <nav class="grid" aria-label="Games">

    <a href="games/memory/">Memory Match <span>↗</span></a>
    <a href="games/colour/">Colour Match <span>↗</span></a>

    <a href="games/tetris/">Tetris <span>↗</span></a>
    <a href="games/snake/">Snake <span>↗</span></a>
    <a href="games/tic/">Tic Tac Toe <span>↗</span></a>
    <a href="games/hockey/">Air Hockey <span>↗</span></a>
    <a href="games/math/">Math Quiz <span>↗</span></a>
    <a href="games/chess/">Chess <span>↗</span></a>
    <a href="games/flappy/">Flappy <span>↗</span></a>
    <a href="games/deadblock/">Deadblock <span>↗</span></a>
  </nav>
</main>
</body>
</html>
