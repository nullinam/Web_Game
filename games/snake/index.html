<!doctype html><html lang="en"><head><script src="../no-audio.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake Game</title>
<style>
*{box-sizing:border-box}:root{--bg:#f3f5f4;--fg:#20312e;--panel:#fff;--line:#dce4df;--soft:#657570}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}.wrap{width:min(92vw,620px);padding:20px}h1{font-size:2rem;letter-spacing:-.03em;margin:0 0 14px;color:#337c68}.top,.actions,.stats{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stats{margin:18px 0;color:var(--soft)}button{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 15px;cursor:pointer}button:hover{border-color:#337c68}canvas{display:block;width:min(100%,500px);aspect-ratio:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:16px auto}.message{text-align:center;min-height:26px}.guide{color:var(--soft);text-align:center;font-size:.9rem}
</style><style id="large-snake-board">.wrap{width:min(96vw,850px)}canvas#board{width:min(100%,min(74vh,740px));margin:12px auto}.stats{font-size:1.15rem}@media(max-width:600px){canvas#board{width:min(100%,calc(100dvh - 250px))}}</style></head><body><div class="wrap"><div class="top"><h1>SNAKE</h1></div><div class="actions"><button id="mode">Box mode</button><button id="start">Start / Restart</button><button id="revive" hidden>Revive once</button></div><div class="stats"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span><span>Level <b id="level">1</b> / 20</span></div><canvas id="board" width="500" height="500"></canvas><div class="message" id="message">Press Start to play</div><p class="guide">Arrow keys or WASD to turn. Box mode has walls; Infinity mode wraps around.</p></div>
<script>
const cv=document.getElementById('board'),g=cv.getContext('2d'),N=25,S=20;const $=id=>document.getElementById(id);let snake,dir,next,food,score=0,level=1,best=Number(localStorage.getItem('snakeBest')||0),mode='Box',timer,usedRevive=false,playing=false,paused=false; $('best').textContent=best;
function reset(){clearTimeout(timer);snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];dir={x:1,y:0};next=dir;score=0;level=1;usedRevive=false;playing=true;$('revive').hidden=true;$('score').textContent='0';$('level').textContent='1';$('message').textContent='';spawn();draw();tick()}
function spawn(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function end(win=false){playing=false;clearTimeout(timer);$('message').textContent=win?'Level 20 complete!':'Game over';if(!usedRevive&&!win)$('revive').hidden=false}
function tick(){if(!playing)return;if(paused){timer=setTimeout(tick,120);return}dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(mode==='Infinity'){h.x=(h.x+N)%N;h.y=(h.y+N)%N}else if(h.x<0||h.x>=N||h.y<0||h.y>=N){end();return}let eat=h.x===food.x&&h.y===food.y;if(snake.slice(0,eat?undefined:-1).some(p=>p.x===h.x&&p.y===h.y)){end();return}snake.unshift(h);if(eat){score++;level=Math.min(20,1+Math.floor(score/5));$('score').textContent=score;$('level').textContent=level;if(score>best){best=score;localStorage.setItem('snakeBest',best);$('best').textContent=best}if(level===20){draw();end(true);return}spawn()}else snake.pop();draw();timer=setTimeout(tick,Math.max(58,185-level*7))}
function draw(){g.fillStyle=getComputedStyle(document.body).getPropertyValue('--panel');g.fillRect(0,0,500,500);g.strokeStyle=getComputedStyle(document.body).getPropertyValue('--line');g.lineWidth=.35;for(let i=0;i<=N;i++){g.beginPath();g.moveTo(i*S,0);g.lineTo(i*S,500);g.moveTo(0,i*S);g.lineTo(500,i*S);g.stroke()}g.fillStyle='#ef4444';g.beginPath();g.arc(food.x*S+10,food.y*S+10,8,0,7);g.fill();g.fillStyle='#22c55e';snake.forEach((p,i)=>g.fillRect(p.x*S+1,p.y*S+1,18,18))}
document.addEventListener('gamehub:pause',e=>{paused=e.detail.paused});
document.addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};if(!m[e.code])return;e.preventDefault();const [x,y]=m[e.code];if(x!==-dir.x||y!==-dir.y)next={x,y}});$('start').onclick=reset;$('revive').onclick=()=>{if(usedRevive)return;usedRevive=true;snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];dir=next={x:1,y:0};spawn();playing=true;$('revive').hidden=true;$('message').textContent='';tick()};$('mode').onclick=()=>{mode=mode==='Box'?'Infinity':'Box';$('mode').textContent=mode+' mode';reset()};
</script></body></html>
