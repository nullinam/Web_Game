<!doctype html>
<html lang="en">
<head><script src="../no-audio.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultimate Tic Tac Toe</title>
<style>
:root{color-scheme:dark;--bg:#101719;--panel:#1a2425;--line:#344345;--mint:#75d6b1;--gold:#efbd70;--ink:#f2f4ed;--muted:#a9b7b2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#253738,var(--bg) 65%);color:var(--ink);font:15px/1.45 system-ui,sans-serif;padding:24px}main{max-width:920px;margin:auto}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}h1{font-size:clamp(1.6rem,4vw,2.6rem);margin:0;color:var(--mint)}header p{margin:4px 0 0;color:var(--muted)}.badge{border:1px solid var(--line);border-radius:20px;padding:7px 12px;color:var(--gold);white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(300px,1fr) 235px;gap:18px;align-items:start}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;background:#0c1213;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 45px #0005}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;position:relative;padding:5px;background:#1b2526;border:1px solid #334142;border-radius:9px;aspect-ratio:1}.mini.active{outline:2px solid var(--gold);outline-offset:1px}.mini.won-x,.mini.won-o,.mini.won-draw{background:#212e2d}.mini.won-x:after,.mini.won-o:after,.mini.won-draw:after{content:attr(data-mark);position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(2.8rem,10vw,6rem);font-weight:800;color:#75d6b188;pointer-events:none}.mini.won-o:after{color:#efbd7088}.cell{border:0;border-radius:5px;background:#293637;color:var(--mint);font-size:clamp(1rem,4.6vw,2.6rem);font-weight:800;cursor:pointer;min-width:0;aspect-ratio:1}.cell.o{color:var(--gold)}.cell:hover:enabled{background:#405150}.cell:disabled{cursor:default}.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px}.status{min-height:48px;color:var(--mint);font-size:1.1rem;font-weight:650}.side p{color:var(--muted);font-size:.9rem}.next{margin:16px 0;padding:11px;background:#111a1b;border-radius:9px;color:var(--gold)}button#restart{width:100%;border:0;border-radius:9px;background:var(--mint);color:#10201b;font:700 1rem system-ui;padding:12px;cursor:pointer}.rules{margin-top:15px;padding-top:13px;border-top:1px solid var(--line);font-size:.85rem!important}@media(max-width:690px){body{padding:15px}.layout{grid-template-columns:1fr}.side{order:-1;display:grid;grid-template-columns:1fr auto;gap:8px 14px}.status{grid-column:1}.next{margin:0}.rules{grid-column:1/-1}.board{gap:5px;padding:7px}.mini{padding:3px;gap:2px}}
</style>
<style id="large-ultimate-board">body{padding:clamp(12px,2vw,28px)}main{max-width:1380px;width:100%}.layout{grid-template-columns:minmax(0,1fr) 280px;gap:24px}.board{width:100%;max-width:980px;justify-self:center}.mini{min-width:0}</style></head><body><main><header><div><h1>Ultimate Tic Tac Toe</h1><p>Win three small boards in a row to win the match.</p></div><span class="badge">You: X&nbsp; · &nbsp;Computer: O</span></header><section class="layout"><div class="board" id="board" aria-label="Ultimate Tic Tac Toe board"></div><aside class="side"><div class="status" id="status" aria-live="polite">Your turn. Choose any square.</div><div class="next" id="next">Next move: any open board</div><button id="restart">Restart match</button><p class="rules">Your move sends the computer to the matching small board. If that board is already finished, the next player may choose any open board.</p></aside></section></main>
<script>
const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let cells,mini,forced=null,turn='X',finished=false,paused=false,thinking=false;const boardEl=document.querySelector('#board'),statusEl=document.querySelector('#status'),nextEl=document.querySelector('#next');
function win(a){for(const l of lines)if(a[l[0]]&&a[l[0]]===a[l[1]]&&a[l[1]]===a[l[2]])return a[l[0]];return null}function closed(i){return !!mini[i]||cells[i].every(Boolean)}function allowed(){return forced!==null&&!closed(forced)?[forced]:mini.map((_,i)=>i).filter(i=>!closed(i))}function macro(){return win(mini)}function render(){boardEl.innerHTML='';for(let b=0;b<9;b++){const box=document.createElement('div');box.className='mini'+(allowed().includes(b)&&!finished?' active':'')+(mini[b]?' won-'+(mini[b]==='D'?'draw':mini[b].toLowerCase()):'');if(mini[b])box.dataset.mark=mini[b]==='D'?'·':mini[b];for(let p=0;p<9;p++){const c=document.createElement('button');c.className='cell'+(cells[b][p]==='O'?' o':'');c.textContent=cells[b][p];c.disabled=finished||paused||thinking||!!mini[b]||!!cells[b][p]||!allowed().includes(b);c.setAttribute('aria-label',`Board ${b+1}, square ${p+1}${cells[b][p]?`, ${cells[b][p]}`:''}`);c.onclick=()=>play(b,p);box.appendChild(c)}boardEl.appendChild(box)}nextEl.textContent=forced===null||closed(forced)?'Next move: any open board':`Next move: board ${forced+1}`}
function endIfWon(){const w=macro();if(w||mini.every((_,i)=>closed(i))){finished=true;statusEl.textContent=w?(w==='X'?'You win the match!':'Computer wins the match.'):'Match drawn.';return true}return false}function place(b,p,s){cells[b][p]=s;const w=win(cells[b]);if(w)mini[b]=w;else if(cells[b].every(Boolean))mini[b]='D';forced=p;return endIfWon()}
function play(b,p){if(finished||paused||thinking||closed(b)||cells[b][p]||!allowed().includes(b))return;if(place(b,p,'X')){render();return}turn='O';thinking=true;statusEl.textContent='Computer is considering the board…';render();setTimeout(()=>{if(paused||!thinking)return;const move=chooseComputerMove();thinking=false;if(move)place(move.b,move.p,'O');turn='X';if(!finished)statusEl.textContent='Your turn.';render()},120)}
function evalState(){let score=0;const weights=[0,2,15,1000];for(let i=0;i<9;i++){if(mini[i]==='O')score+=120;else if(mini[i]==='X')score-=120;else if(mini[i]!=='D'){for(const l of lines){let o=0,x=0;for(const p of l){o+=cells[i][p]==='O';x+=cells[i][p]==='X'}if(!x)score+=weights[o];if(!o)score-=weights[x]}score+=(cells[i][4]==='O'?2:cells[i][4]==='X'?-2:0)}}for(const l of lines){let o=0,x=0;for(const i of l){o+=mini[i]==='O';x+=mini[i]==='X'}if(!x)score+=o===2?90:o===1?12:0;if(!o)score-=x===2?110:x===1?12:0}return score}
function chooseComputerMove(){let moves=[];for(const b of allowed())for(let p=0;p<9;p++)if(!cells[b][p])moves.push({b,p});let best=null,bestScore=-Infinity;for(const m of moves){const snap=cells.map(r=>r.slice()),oldMini=mini.slice(),oldForced=forced,oldFinished=finished;place(m.b,m.p,'O');let score=finished?(macro()==='O'?100000:0):evalState();if(!finished){let replies=[];for(const b of allowed())for(let p=0;p<9;p++)if(!cells[b][p])replies.push({b,p});let worst=Infinity;for(const r of replies){const s2=cells.map(a=>a.slice()),m2=mini.slice(),f2=forced,done2=finished;place(r.b,r.p,'X');const response=finished?(macro()==='X'?-100000:0):evalState();worst=Math.min(worst,response);cells=s2;mini=m2;forced=f2;finished=done2}score=score*.25+worst*.75}cells=snap;mini=oldMini;forced=oldForced;finished=oldFinished;score+=Math.random()*.12;if(score>bestScore){bestScore=score;best=m}}return best}
function reset(){cells=Array.from({length:9},()=>Array(9).fill(''));mini=Array(9).fill('');forced=null;turn='X';finished=false;thinking=false;statusEl.textContent='Your turn. Choose any square.';render()}document.querySelector('#restart').onclick=reset;document.addEventListener('gamehub:pause',e=>{paused=e.detail.paused;if(!paused&&thinking){thinking=false;setTimeout(()=>{if(paused){thinking=true;return}const m=chooseComputerMove();if(m)place(m.b,m.p,'O');if(!finished)statusEl.textContent='Your turn.';render()},50)}render()});reset();
</script></body></html>
