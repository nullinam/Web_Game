<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic Tac Toe AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#f2f2f2;font:17px system-ui,sans-serif;text-align:center;min-height:100vh;padding:42px 15px}h1{color:#00ffb3;font-size:2.5rem;margin:0 0 7px}.badge{display:inline-block;background:#1f2937;color:#00ffb3;border-radius:20px;padding:7px 15px;font-size:.8rem}.board{width:min(92vw,316px);margin:28px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.cell{aspect-ratio:1;border:0;border-radius:12px;background:#1f2937;color:#00ffb3;font:bold 3rem system-ui;cursor:pointer}.cell.o{color:#ffb84d}.cell:hover{background:#29394a}#status{font-size:1.2rem;min-height:34px}button#restart{background:#00ffb3;color:#101820;padding:12px 25px;border:0;border-radius:8px;font-weight:700;cursor:pointer}
</style></head><body><h1>Tic Tac Toe AI</h1><div class="badge">UNBEATABLE AI</div><div class="board" id="board"></div><p id="status">Your turn — X</p><button id="restart">Restart Game</button><script>
let b=Array(9).fill(''),done=false;const board=document.getElementById('board'),status=document.getElementById('status'),wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function outcome(a){for(const line of wins){let [x,y,z]=line;if(a[x]&&a[x]===a[y]&&a[x]===a[z])return a[x]}return a.every(Boolean)?'draw':null}
function minimax(a,turn,depth){const out=outcome(a);if(out)return {score:out==='O'?10-depth:out==='X'?depth-10:0};let choice={score:turn==='O'?-Infinity:Infinity};for(let i=0;i<9;i++){if(a[i])continue;a[i]=turn;let v=minimax(a,turn==='O'?'X':'O',depth+1);a[i]='';if((turn==='O'&&v.score>choice.score)||(turn==='X'&&v.score<choice.score))choice={score:v.score,index:i}}return choice}
function render(){board.innerHTML='';b.forEach((v,i)=>{let c=document.createElement('button');c.className='cell '+(v==='O'?'o':'');c.textContent=v;c.setAttribute('aria-label','Cell '+(i+1)+(v?' '+v:''));c.onclick=()=>move(i);board.appendChild(c)})}
function move(i){if(done||b[i])return;b[i]='X';render();let result=outcome(b);if(result){finish(result);return}status.textContent='AI is thinking…';setTimeout(()=>{let idx=minimax(b,'O',0).index;if(idx!==undefined)b[idx]='O';render();let out=outcome(b);if(out)finish(out);else status.textContent='Your turn — X'},250)}
function finish(out){done=true;status.textContent=out==='draw'?'Draw!':out==='X'?'You win!':'AI wins!'}
document.getElementById('restart').onclick=()=>{b=Array(9).fill('');done=false;status.textContent='Your turn — X';render()};render();
</script></body></html>
