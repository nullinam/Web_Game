<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TypingPro</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#151d32,#080c16 80%);color:#f8fafc;font:16px system-ui,sans-serif;min-height:100vh}header{border-bottom:1px solid #ffffff19;padding:18px max(20px,calc((100vw - 1050px)/2));display:flex;align-items:center;justify-content:space-between}h1{font-size:23px;margin:0;color:#fff}header span{color:#6366f1}.shell{max-width:1050px;margin:55px auto;padding:0 20px}.intro{text-align:center;margin-bottom:28px}.intro h2{font-size:clamp(28px,5vw,42px);margin:0 0 8px}.intro p{color:#94a3b8;margin:0}.card{background:#10182ab8;border:1px solid #ffffff18;border-radius:20px;padding:27px;box-shadow:0 20px 60px #0003}.settings,.metrics,.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.settings{justify-content:space-between;margin-bottom:23px}label{font-size:13px;color:#94a3b8}select,button{background:#1b2740;color:white;border:1px solid #ffffff24;border-radius:8px;padding:10px 13px;font:inherit}button{cursor:pointer}button.primary{background:#6366f1;border-color:#6366f1;font-weight:700}.metrics{justify-content:space-between;padding:18px 0;border-top:1px solid #ffffff12;border-bottom:1px solid #ffffff12}.metric b{font-size:26px;display:block}.metric small{color:#94a3b8;text-transform:uppercase;letter-spacing:.08em}.passage{font:23px/1.8 'Courier New',monospace;min-height:165px;padding:24px;background:#0b1323;border-radius:12px;color:#64748b;white-space:pre-wrap;overflow-wrap:anywhere}.passage .ok{color:#22c55e}.passage .bad{color:#ef4444;text-decoration:underline wavy}.passage .current{border-left:2px solid #8b5cf6}textarea{width:100%;min-height:90px;margin-top:15px;resize:vertical;background:#080f1c;color:#e2e8f0;border:1px solid #ffffff2a;border-radius:10px;padding:15px;font:18px 'Courier New',monospace;outline:none}textarea:focus{border-color:#6366f1}.actions{justify-content:space-between;margin-top:15px}.notice{color:#94a3b8}.history{margin-top:22px}.history h3{margin:0 0 10px}.history ol{padding-left:20px;color:#94a3b8}
</style></head><body><header><h1>⌨ <span>Typing</span>Pro</h1><div>Smart Typing Speed Test</div></header><div class="shell"><div class="intro"><h2>Test your typing speed</h2><p>Type the text below as quickly and accurately as you can.</p></div><div class="card"><div class="settings"><div><label for="difficulty">Difficulty</label><br><select id="difficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option></select></div><div><label for="duration">Duration</label><br><select id="duration"><option value="15">15 seconds</option><option value="30">30 seconds</option><option value="60" selected>60 seconds</option><option value="120">120 seconds</option></select></div><button class="primary" id="restart">New test</button></div><div class="metrics"><div class="metric"><b id="time">60</b><small>seconds left</small></div><div class="metric"><b id="wpm">0</b><small>WPM</small></div><div class="metric"><b id="accuracy">100%</b><small>accuracy</small></div><div class="metric"><b id="errors">0</b><small>errors</small></div></div><p class="passage" id="passage"></p><textarea id="entry" spellcheck="false" autocomplete="off" autocorrect="off" placeholder="Click here and begin typing…"></textarea><div class="actions"><span class="notice" id="notice">The timer starts when you type.</span><button id="focus">Focus input</button></div></div><div class="card history"><h3>Recent tests</h3><ol id="history"></ol></div></div><script>
const texts={Easy:['The quick brown fox jumps over the lazy dog. Every day is a new chance to learn something useful.','Take a deep breath and begin. A little practice each day can make a big difference.','Small steps help us move forward. Keep your hands steady and watch the words appear.'],Medium:['Good ideas often begin with a simple question. The challenge is to turn curiosity into steady progress, one careful step at a time.','Typing well is a rhythm: read ahead, keep a relaxed pace, and let accuracy guide your speed. The best results come from practice.','A quiet morning offers time to think clearly. Focus on the next sentence, correct mistakes, and finish what you started.'],Hard:['Precision matters: 42% of the solution depends on timing, yet 100% of the result depends on thoughtful execution.','When the interface responds in 16.7ms, even subtle delays become noticeable; measure twice, optimize once, and document the trade-offs.','Complexity rises quickly: (x + y) * 3 = 57. Can you keep a 95% accuracy rate while navigating symbols, numbers, and punctuation?']};const $=id=>document.getElementById(id);let target='',typed='',start=0,remaining=60,timer=null,finished=false,history=JSON.parse(localStorage.getItem('typingHistory')||'[]');function paint(){let html='';for(let i=0;i<target.length;i++){let s=typed[i]===undefined?'':typed[i]===target[i]?'ok':'bad';if(i===typed.length)s+=' current';html+='<span class="'+s+'">'+(target[i]===' ' ? ' ' : target[i].replace('&','&amp;').replace('<','&lt;'))+'</span>'}$('passage').innerHTML=html;let correct=[...typed].filter((v,i)=>v===target[i]).length,seconds=start?Math.max(1,(Date.now()-start)/1000):1;$('wpm').textContent=Math.round(correct/5/(seconds/60));$('accuracy').textContent=typed.length?Math.round(correct/typed.length*100)+'%':'100%';$('errors').textContent=typed.length-correct;$('time').textContent=remaining}
function reset(){clearInterval(timer);timer=null;start=0;typed='';finished=false;remaining=Number($('duration').value);let pool=texts[$('difficulty').value];target=pool[Math.floor(Math.random()*pool.length)];$('entry').value='';$('entry').disabled=false;$('notice').textContent='The timer starts when you type.';paint();$('entry').focus()}function finish(){if(finished)return;finished=true;clearInterval(timer);$('entry').disabled=true;let record={wpm:Number($('wpm').textContent),accuracy:$('accuracy').textContent,date:new Date().toLocaleDateString()};history.unshift(record);history=history.slice(0,5);localStorage.setItem('typingHistory',JSON.stringify(history));showHistory();$('notice').textContent='Test complete. Choose New test to try again.'}
function showHistory(){$('history').innerHTML=history.length?history.map(r=>'<li>'+r.wpm+' WPM · '+r.accuracy+' accuracy · '+r.date+'</li>').join(''):'<li>No tests yet</li>'}
$('entry').addEventListener('input',()=>{if(finished)return;if(!start){start=Date.now();timer=setInterval(()=>{remaining=Math.max(0,Math.ceil(Number($('duration').value)-(Date.now()-start)/1000));paint();if(!remaining)finish()},100)}typed=$('entry').value.slice(0,target.length);if($('entry').value!==typed)$('entry').value=typed;paint();if(typed.length===target.length)finish()});$('restart').onclick=reset;$('focus').onclick=()=>$('entry').focus();$('difficulty').onchange=reset;$('duration').onchange=reset;showHistory();reset();
</script></body></html>
