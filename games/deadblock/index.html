<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deadblock</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#eee;min-height:100vh;display:grid;place-items:center;overflow:hidden;font:16px monospace}canvas{width:min(100vw,1100px);aspect-ratio:16/9;border:2px solid #333;cursor:crosshair;image-rendering:pixelated}#help{position:fixed;bottom:8px;left:10px;color:#aaa;font-size:12px}</style></head><body><canvas id="game" width="960" height="540"></canvas><div id="help">WASD move · mouse aim and click shoot · E interact · P / Esc pause</div><script>
const c=document.getElementById('game'),g=c.getContext('2d'),keys=new Set(),mouse={x:480,y:270,down:false};let state='menu',wave=1,health=100,coins=0,damage=1,kills=0,player={x:480,y:270},zombies=[],bullets=[],drops=[],walls=[],spawnT=0,shotT=0,last=performance.now(),levelPick=1;function rand(a,b){return a+Math.random()*(b-a)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function reset(){state='play';wave=levelPick;health=100;coins=0;damage=1;kills=0;player={x:480,y:270};zombies=[];bullets=[];drops=[];spawnT=0;walls=[];for(let i=0;i<14;i++){let w={x:rand(50,850),y:rand(50,450),w:rand(35,95),h:rand(30,70)};if(Math.hypot(w.x-480,w.y-270)>150)walls.push(w)}}function spawn(){let side=Math.floor(Math.random()*4),z={x:side===0?-20:side===1?980:rand(0,960),y:side===2?-20:side===3?560:rand(0,540),hp:2+Math.floor(wave/3),speed:rand(.7,1.4)+wave*.06};zombies.push(z)}
function fire(){let d=Math.hypot(mouse.x-player.x,mouse.y-player.y)||1;bullets.push({x:player.x,y:player.y,vx:(mouse.x-player.x)/d*10,vy:(mouse.y-player.y)/d*10,life:75})}function interact(){if(state!=='play')return;if(dist(player,{x:65,y:65})<75&&coins>=5){coins-=5;health=Math.min(100,health+40)}if(dist(player,{x:890,y:65})<75&&coins>=8){coins-=8;damage++}}
document.addEventListener('keydown',e=>{keys.add(e.code);if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyP'||e.code==='Escape'){state=state==='play'?'pause':state==='pause'?'play':state}if(e.code==='KeyE')interact();if(state==='menu'&&e.code==='KeyL')state='levels';if(state==='levels'&&/^Digit[1-9]$/.test(e.code)){levelPick=Number(e.code.slice(5));reset()}if((state==='menu'||state==='dead')&&(e.code==='Enter'||e.code==='Space'))reset()});document.addEventListener('keyup',e=>keys.delete(e.code));document.addEventListener('gamehub:pause',e=>{if(e.detail.paused&&state==='play')state='pause';else if(!e.detail.paused&&state==='pause')state='play'});c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*960/r.width;mouse.y=(e.clientY-r.top)*540/r.height});c.addEventListener('mousedown',()=>{mouse.down=true;if(state==='menu'||state==='dead')reset();else if(state==='pause')state='play'});document.addEventListener('mouseup',()=>mouse.down=false);
function update(dt){if(state!=='play')return;let s=dt/16.67,mx=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0),my=(keys.has('KeyS')?1:0)-(keys.has('KeyW')?1:0),m=Math.hypot(mx,my)||1;player.x=Math.max(16,Math.min(944,player.x+mx/m*3.5*s));player.y=Math.max(16,Math.min(524,player.y+my/m*3.5*s));shotT-=dt;if(mouse.down&&shotT<=0){fire();shotT=Math.max(75,190-damage*12)}spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(280,1100-wave*45)}for(let z of zombies){let dx=player.x-z.x,dy=player.y-z.y,d=Math.hypot(dx,dy)||1;z.x+=dx/d*z.speed*s;z.y+=dy/d*z.speed*s;if(d<22){health-=.3*s;if(health<=0)state='dead'}}for(let b of bullets){b.x+=b.vx*s;b.y+=b.vy*s;b.life-=s;for(let z of zombies){if(z.hp>0&&dist(b,z)<17){z.hp-=damage;b.life=0;if(z.hp<=0){kills++;if(Math.random()<.72)drops.push({x:z.x,y:z.y});if(kills%12===0)wave++}break}}}zombies=zombies.filter(z=>z.hp>0);bullets=bullets.filter(b=>b.life>0&&b.x>0&&b.x<960&&b.y>0&&b.y<540);drops=drops.filter(d=>{if(dist(d,player)<22){coins++;return false}return true})}
function draw(){g.fillStyle='#171b1e';g.fillRect(0,0,960,540);g.strokeStyle='#252a2d';g.lineWidth=1;for(let x=0;x<960;x+=40){g.beginPath();g.moveTo(x,0);g.lineTo(x,540);g.stroke()}for(let y=0;y<540;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(960,y);g.stroke()}for(let w of walls){g.fillStyle='#303337';g.fillRect(w.x,w.y,w.w,w.h);g.strokeStyle='#484c50';g.strokeRect(w.x,w.y,w.w,w.h)}function shop(x,label,price,col){g.fillStyle=col;g.fillRect(x-28,32,56,56);g.fillStyle='#fff';g.font='12px monospace';g.fillText(label,x-34,108);g.fillText(price+' coins',x-31,123)}shop(65,'HOSPITAL',5,'#317d60');shop(890,'ARMORY',8,'#876d38');for(let d of drops){g.fillStyle='#f3c04d';g.beginPath();g.arc(d.x,d.y,5,0,7);g.fill()}for(let b of bullets){g.fillStyle='#f5d179';g.beginPath();g.arc(b.x,b.y,3,0,7);g.fill()}for(let z of zombies){g.fillStyle='#779a69';g.fillRect(z.x-11,z.y-11,22,22);g.fillStyle='#e45d5d';g.fillRect(z.x-5,z.y-4,3,3);g.fillRect(z.x+3,z.y-4,3,3)}let angle=Math.atan2(mouse.y-player.y,mouse.x-player.x);g.fillStyle='#c9d2dc';g.beginPath();g.arc(player.x,player.y,12,0,7);g.fill();g.strokeStyle='#d5d5d5';g.lineWidth=6;g.beginPath();g.moveTo(player.x,player.y);g.lineTo(player.x+Math.cos(angle)*22,player.y+Math.sin(angle)*22);g.stroke();g.fillStyle='#0009';g.fillRect(0,0,960,28);g.fillStyle='#fff';g.font='16px monospace';g.fillText('HP '+Math.max(0,Math.ceil(health))+'   COINS '+coins+'   WAVE '+wave+'   KILLS '+kills,15,20);
if(state!=='play'){g.fillStyle='#000c';g.fillRect(0,0,960,540);g.textAlign='center';g.fillStyle='#f0f0f0';g.font='bold 58px monospace';g.fillText(state==='dead'?'YOU DIED':state==='pause'?'PAUSED':state==='levels'?'SELECT LEVEL':'DEADBLOCK',480,220);g.font='18px monospace';g.fillText(state==='levels'?'Press 1–9 to start':state==='pause'?'Press P to resume':'Click or press Enter to play',480,270);if(state==='menu'){g.fillText('L — level select',480,305);g.fillText('Survive zombie waves. Collect coins and visit the shops.',480,340)}g.textAlign='left'}}
function frame(t){let dt=Math.min(35,t-last);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script><script src="../game-shell.js"></script></body></html>
