<!doctype html>
<html lang="en">
<head><script src="../no-audio.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>chess.exe — lowkey.exe</title>
  <style>
    :root{color-scheme:dark;--bg:#0a0a0a;--panel:#111314;--line:#303536;--text:#dededb;--muted:#919899;--accent:#aeb9bb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}main{max-width:960px;margin:28px auto;padding:20px}.heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}.heading h1{font:600 clamp(24px,5vw,38px)/1 ui-monospace,monospace;margin:0}.heading p{color:var(--muted);font:12px ui-monospace,monospace;margin:7px 0 0}.layout{display:grid;grid-template-columns:minmax(0,600px) minmax(190px,1fr);gap:20px;align-items:start}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));width:min(100%,min(68vh,600px));aspect-ratio:1;justify-self:center;align-self:start;border:1px solid var(--line);box-shadow:0 15px 50px #0008;contain:layout size}.square{display:grid;place-items:center;position:relative;min-width:0;min-height:0;border:0;padding:0;font-size:clamp(23px,6vw,56px);line-height:1;cursor:pointer}.light{background:#bdc1bd;color:#171a19}.dark{background:#4b5552;color:#f2f3ee}.square.selected{outline:3px solid var(--accent);outline-offset:-3px}.square.legal:after{content:"";position:absolute;width:22%;aspect-ratio:1;border-radius:50%;background:#15201b82}.square.capture:after{width:80%;background:transparent;border:4px solid #14201c99}.piece{position:relative;z-index:1;text-shadow:0 2px 3px #0004}.side{border:1px solid var(--line);background:var(--panel);padding:16px}.status{font:12px ui-monospace,monospace;color:var(--accent);min-height:40px}.actions{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.actions button,.actions select{background:#ffffff06;color:var(--text);border:1px solid var(--line);padding:9px 12px;font:11px ui-monospace,monospace}.actions select{flex:1;min-width:128px}.actions button:hover,.actions select:focus{border-color:var(--accent)}.moves{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;color:var(--muted);font:11px/1.8 ui-monospace,monospace;max-height:200px;overflow:auto}.note{color:#9da5a5;font-size:11px;margin-top:14px}@media(max-width:700px){main{margin:18px auto;padding:12px}.layout{grid-template-columns:1fr}.board{width:min(100%,min(72vh,560px));margin:auto}.side{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}.side .actions,.side .moves,.side .note{grid-column:1/-1}}
  </style>
</head>
<body>
  <main>
    <header class="heading"><div><h1>chess.exe</h1><p>Play against the machine. Choose your challenge.</p></div><span id="turnLabel">WHITE TO MOVE</span></header>
    <div class="layout"><div class="board" id="board" role="grid" aria-label="Chess board"></div><aside class="side"><div class="status" id="status" aria-live="polite">Your move.</div><div class="actions"><label for="level">AI level</label><select id="level" aria-label="AI difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option><option value="expert">Expert</option></select><button id="restart" type="button">Restart</button><button id="flip" type="button">Flip board</button></div><div class="moves" id="moves">move log<br>—</div><p class="note">Click one of your pieces, then a highlighted square. Promotion defaults to a queen. The AI evaluates captures, material and central control.</p></aside></div>
  </main>
  <script src="js/chess.js"></script>
  <script>
  (()=>{
    const game=new Chess(),board=document.getElementById('board'),status=document.getElementById('status'),turnLabel=document.getElementById('turnLabel'),moveLog=document.getElementById('moves');
    const symbols={wp:'♙',wn:'♘',wb:'♗',wr:'♖',wq:'♕',wk:'♔',bp:'♟',bn:'♞',bb:'♝',br:'♜',bq:'♛',bk:'♚'},level=document.getElementById('level');let selected=null,legal=[],flipped=false,paused=false,thinking=false,history=[],nodes=0;
    const squares=()=>{const out=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){const rank=flipped?r+1:8-r,file=String.fromCharCode(97+(flipped?7-c:c));out.push(file+rank)}return out};
    function render(){board.innerHTML='';squares().forEach((sq,i)=>{const [file,rank]=sq.split(''),f=file.charCodeAt(0)-97,r=Number(rank)-1,piece=game.get(sq),button=document.createElement('button');button.type='button';button.className='square '+((r+f)%2?'dark':'light');button.setAttribute('role','gridcell');button.setAttribute('aria-label',sq+(piece?` ${piece.color==='w'?'white':'black'} ${piece.type}`:''));if(selected===sq)button.classList.add('selected');const move=legal.find(item=>item.to===sq);if(move)button.classList.add(game.get(sq)?'capture':'legal');if(piece){const glyph=document.createElement('span');glyph.className='piece';glyph.textContent=symbols[piece.color+piece.type];button.appendChild(glyph)}button.addEventListener('click',()=>choose(sq));board.appendChild(button)});turnLabel.textContent=game.game_over()?'GAME OVER':game.turn()==='w'?'WHITE TO MOVE':'BLACK TO MOVE';moveLog.innerHTML=history.length?'<b>move log</b><br>'+history.map((move,i)=>`${i%2===0?Math.floor(i/2)+1+'.':''} ${move}`).join(''):'move log<br>—';moveLog.scrollTop=moveLog.scrollHeight}
    function choose(sq){if(paused||thinking||game.game_over()||game.turn()!=='w')return;const piece=game.get(sq);if(selected&&legal.some(move=>move.to===sq)){const result=game.move({from:selected,to:sq,promotion:'q'});if(result){history.push(result.san);selected=null;legal=[];render();if(!game.game_over()){thinking=true;status.textContent='Opponent is thinking…';setTimeout(computerMove,120)}}return}if(piece&&piece.color==='w'){selected=sq;legal=game.moves({square:sq,verbose:true});}else{selected=null;legal=[]}render()}
    function evaluate(){const values={p:100,n:320,b:330,r:500,q:900,k:0};let score=0,bishops={w:0,b:0};game.board().forEach((row,r)=>row.forEach((piece,c)=>{if(!piece)return;const sign=piece.color==='b'?1:-1,center=7-(Math.abs(3.5-r)+Math.abs(3.5-c));let positional= center*(piece.type==='n'||piece.type==='b'?8:piece.type==='p'?3:1);if(piece.type==='p')positional+=(piece.color==='b'?r:7-r)*5;if(piece.type==='b')bishops[piece.color]++;score+=sign*(values[piece.type]+positional)}));if(bishops.b>=2)score+=28;if(bishops.w>=2)score-=28;return score}
    function orderedMoves(){return game.moves({verbose:true}).sort((a,b)=>moveOrder(b)-moveOrder(a))}
    function moveOrder(move){const values={p:100,n:320,b:330,r:500,q:900,k:20000};return (move.captured?10*values[move.captured]-values[move.piece]:0)+(move.promotion?values[move.promotion]:0)}
    function search(depth,alpha,beta,maximizing){nodes++;if(depth===0||game.game_over()||nodes>45000){if(game.in_checkmate())return game.turn()==='b'?-100000-depth:100000+depth;return evaluate()}const moves=orderedMoves();if(maximizing){let value=-Infinity;for(const move of moves){game.move(move);value=Math.max(value,search(depth-1,alpha,beta,false));game.undo();alpha=Math.max(alpha,value);if(alpha>=beta||nodes>45000)break}return value}let value=Infinity;for(const move of moves){game.move(move);value=Math.min(value,search(depth-1,alpha,beta,true));game.undo();beta=Math.min(beta,value);if(beta<=alpha||nodes>45000)break}return value}
    function computerMove(){if(paused){setTimeout(computerMove,120);return}thinking=false;if(game.game_over()||game.turn()!=='b')return;const depths={easy:1,medium:2,hard:3,expert:4},moves=orderedMoves();let best=-Infinity,choices=[];nodes=0;for(const move of moves){game.move(move);const score=search(depths[level.value],-Infinity,Infinity,false);game.undo();if(score>best){best=score;choices=[move]}else if(score===best)choices.push(move)}const chosen=choices[Math.floor(Math.random()*choices.length)];if(chosen){const result=game.move({from:chosen.from,to:chosen.to,promotion:'q'});history.push(result.san)}render();announce()}
    function announce(){if(game.in_checkmate())status.textContent=game.turn()==='w'?'Checkmate. The machine wins.':'Checkmate. You win.';else if(game.in_draw())status.textContent='Draw. Neither side gets to brag.';else if(game.in_check())status.textContent='Check.';else status.textContent=game.turn()==='w'?'Your move.':'Opponent to move.'}
    document.getElementById('restart').addEventListener('click',()=>{game.reset();history=[];selected=null;legal=[];thinking=false;paused=false;status.textContent='Your move.';render()});document.getElementById('flip').addEventListener('click',()=>{flipped=!flipped;render()});document.addEventListener('gamehub:pause',event=>{paused=event.detail.paused;status.textContent=paused?'Paused.':game.turn()==='w'?'Your move.':'Opponent to move.'});render();
  })();
  </script>

</body>
</html>
