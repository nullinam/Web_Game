<!doctype html>
<html lang="en">
<head>
  <script src="../no-audio.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11151a">
  <title>Chess vs AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar"><a class="home" href="../../" aria-label="Return to game library">‹ library</a><div class="title"><span class="mark">♞</span><div><p>LOWKEY / STRATEGY</p><h1>Chess</h1></div></div><button id="newGameBtn" class="button quiet" type="button">New game</button></header>
    <section class="game-container" aria-label="Chess against computer">
      <div class="board-wrap"><div class="board-label">WHITE · YOU <span>BLACK · COMPUTER</span></div><div id="board" role="grid" aria-label="Chess board"></div></div>
      <aside class="side-panel">
        <div class="status-card"><div class="status-dot"></div><div><small>GAME STATUS</small><div id="status" aria-live="polite">Your move — White</div></div></div>
        <label class="difficulty">Computer difficulty<select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option><option value="expert">Expert</option></select></label>
        <button id="undoBtn" class="button" type="button">Undo turn</button>
        <div class="history-head"><h2>Move history</h2><span id="moveCount">0 moves</span></div><div id="history" aria-live="polite"></div>
        <p class="help">Choose a white piece, then a highlighted square. The computer plays Black.</p>
      </aside>
    </section>
  </main>
  <div id="promotionModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="promotionTitle"><div class="modal-content"><p id="promotionTitle">Choose a promotion piece</p><div id="promotionChoices"></div></div></div>
  <script src="script.js"></script>
</body>
</html>
