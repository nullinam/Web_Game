<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <title>Memory Match</title>

  <link rel="stylesheet" href="src/css/styles.css">
  <link rel="stylesheet" href="src/css/buttons.css">
<style id="quickplay-memory-theme">

hover,.difficulty-btn:hover{transform:translateY(-1px)!important}.btn--active{background:#3d806c!important;color:#fff!important}.top-row{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:14px!important;flex-wrap:wrap!important}.top-btns{display:flex!important}.progress{font-size:1.05rem!important}.deck{gap:clamp(5px,1.2vw,12px)!important;max-width:900px!important;margin:18px auto!important;grid-template-columns:repeat(4,minmax(0,1fr))!important}.card,.memory-card,.game-card{width:100%!important;aspect-ratio:1!important;min-width:0!important;border-radius:12px!important;box-shadow:0 5px 15px #192b2315!important}.card-face{border-radius:12px!important}.card-back{background:linear-gradient(145deg,#12304a,#071827)!important}.card-back .logo{font-family:system-ui,sans-serif!important;color:#f0c65c!important}.card-front{background:#f5f7f5!important}.card-front img{max-width:70%!important;max-height:70%!important;object-fit:contain!important}.memory-symbol{font-size:clamp(22px,5vw,52px)!important;line-height:1!important}.bottom-controls,#restart-bottom{display:none!important}body[data-memory-difficulty="hard"] .deck{grid-template-columns:repeat(8,minmax(0,1fr))!important;max-width:900px!important}body[data-memory-difficulty="hard"] .card-face{font-size:clamp(9px,1.3vw,15px)!important}body[data-memory-difficulty="hard"] .card-back .logo{font-size:clamp(9px,1.3vw,15px)!important}@media(max-width:760px){.app{padding:10px!important}.panel{grid-template-columns:1fr!important;gap:12px!important}.game{padding:14px!important}.score-box{justify-content:space-between!important;gap:10px!important}.deck{grid-template-columns:repeat(4,minmax(0,1fr))!important}.card{width:100%!important}body[data-memory-difficulty="hard"] .deck{grid-template-columns:repeat(8,minmax(0,1fr))!important;gap:3px!important}.top-row{align-items:flex-start!important}}

<style>
.score-box>div:nth-of-type(2){display:none!important}
.app{display:flex!important;flex-direction:column!important;max-width:1160px!important;margin:18px auto!important;padding:14px!important;gap:14px!important}.panel{display:grid!important;grid-template-columns:minmax(180px,1fr) 2fr!important;align-items:center!important;gap:18px!important}.panel,.game{box-shadow:0 8px 28px #15251d0c!important}.theme-toggle,.page-container,.hint,#leaderboardList,.lb-controls,#openHighScores,#exportLb,#shareLb,#clearLb,#playDemo,.panel>div:last-child{display:none!important}.score-box{display:flex!important;align-items:center!important;gap:22px!important;background:transparent!important;border:0!important;padding:0!important}.score-row{gap:25px!important;margin:0!important}.score-big{color:#3d806c!important;font-size:1.5rem!important}.controls .btn:not(#restart){display:none!important}.top-row{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:14px!important;flex-wrap:wrap!important}.deck{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:clamp(5px,1.2vw,12px)!important;max-width:900px!important;margin:18px auto!important}.card{width:100%!important;aspect-ratio:1!important;min-width:0!important;border-radius:12px!important;box-shadow:0 5px 15px #192b2315!important}.card-face{border-radius:12px!important}.card-back{background:linear-gradient(145deg,#12304a,#071827)!important}.card-back .logo{font-family:system-ui,sans-serif!important;color:#f0c65c!important}.card-front{background:#f5f7f5!important}.card-front img{max-width:70%!important;max-height:70%!important;object-fit:contain!important}.memory-symbol{font-size:clamp(22px,5vw,52px)!important;line-height:1!important}#restart-bottom,.bottom-controls{display:none!important}body[data-memory-difficulty="hard"] .deck{grid-template-columns:repeat(8,minmax(0,1fr))!important}body[data-memory-difficulty="hard"] .card-face,body[data-memory-difficulty="hard"] .card-back .logo{font-size:clamp(9px,1.3vw,15px)!important}@media(max-width:760px){.app{padding:10px!important}.panel{grid-template-columns:1fr!important;gap:12px!important}.game{padding:14px!important}.score-box{justify-content:space-between!important;gap:10px!important}body[data-memory-difficulty="hard"] .deck{grid-template-columns:repeat(8,minmax(0,1fr))!important;gap:3px!important}.top-row{align-items:flex-start!important}}
</style></head>

<body>
  <div class="app" role="application" aria-label="Memory Match Game">
    <aside class="panel" aria-hidden="false">
      <div class="brand">
        <div class="vault-badge"><img src="img/LogoMain.png"></div>
        <div>
          <h1 class="title">Memory Match</h1>
          <div class="subtitle">Match each pair</div>
        </div>
      </div>

      <div class="score-box">
        <div class="score-row">
          <div>
            <div class="label">Moves</div>
            <div class="score-big" id="moves">0</div>
          </div>
          <div>
            <div class="label">Time</div>
            <div class="score-big" id="time">00:00</div>
            <div class="timer-bar" aria-hidden="true">
              <div id="timerBar" class="timer-bar-fill"></div>
            </div>
          </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-top:1rem">
          <div>
            <div class="label">Star Rating</div>
            <div class="stars" id="star-rating">
              <div class="star" data-star="1">★</div>
              <div class="star" data-star="2">★</div>
              <div class="star" data-star="3">★</div>
            </div>
          </div>

          <div style="text-align:right">
            <div class="label">Pairs</div>
            <div class="score-big" id="pairs">0 / 8</div>
          </div>
        </div>

        <div style="margin-top:1.2rem;padding:0.8rem 0;border-top:1px solid rgba(137, 166, 207, 0.2)">
          <label for="move-limit-toggle" style="display:flex;align-items:center;gap:0.5rem;cursor:pointer">
            <input type="checkbox" id="move-limit-toggle" />
            <span>Enable Move Limit</span>
          </label>
        </div>

        <div id="move-limit-display" style="display:none;margin-top:0.6rem;padding:0.6rem;background:rgba(255, 210, 63, 0.1);border-radius:4px;color:var(--muted);font-size:0.9rem">
          Moves: <span id="remaining-moves"></span> remaining
        </div>

        <!-- ✅ Updated Controls Section with Pause/Resume -->
        <div class="controls" style="margin-top:1.2rem;display:flex;flex-wrap:wrap;gap:0.5rem">
          <button class="btn" id="restart">Restart</button>
          <button class="btn ghost" id="hint">Reveal 1 Pair</button>
          <button class="btn ghost" id="pause-btn">Pause</button>
          <button class="btn ghost" id="resume-btn" disabled>Resume</button>
        </div>

        <div class="hint" style="margin-top:1rem;padding:0.8rem;background:rgba(137, 166, 207, 0.1);border-radius:4px">

        </div>

        <div style="margin-top:1.5rem;padding-top:1.2rem;border-top:1px solid rgba(137, 166, 207, 0.2)">
          <div class="label" style="margin-bottom:0.8rem">Leaderboard</div>
          <div class="lb-list" id="leaderboardList" style="margin-bottom:1rem"></div>
          <div class="lb-controls" style="display:grid;grid-template-columns:repeat(2, 1fr);gap:0.5rem">
            <button class="btn ghost" id="openHighScores">High Scores</button>
            <button class="btn ghost" id="exportLb">Export</button>
            <button class="btn ghost" id="shareLb">Share</button>
            <button class="btn ghost" id="clearLb">Clear</button>
          </div>
        </div>
      </div>

      <div style="margin-top:1.5rem;padding:1rem;background:rgba(137, 166, 207, 0.08);border-radius:6px;font-size:0.85rem;color:#89a6cf;display:flex;gap:0.8rem;align-items:flex-start">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex-shrink:0;margin-top:2px">
          <path d="M12 2v6" stroke="#ffd23f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M5 8c1-6 14-6 14 0" stroke="#89a6cf" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <div></div>
      </div>
    </aside>

    <main class="game">
      <div class="top-row">
        <div class="progress">Find all matching pairs.</div>
        <div class="top-btns">
          <div id="difficultyControls" style="font-family:'Share Tech Mono',monospace;color:var(--muted);display:flex;gap:0.4rem;align-items:center">
            <div style="color:var(--muted)">Difficulty:</div>
            <button class="btn difficulty-btn" data-diff="easy">Easy</button>
            <button class="btn difficulty-btn btn--active" data-diff="medium">Medium</button>
            <button class="btn difficulty-btn" data-diff="hard">Hard</button>
          </div>
          <div style="display:flex;gap:0.5rem;align-items:center">
            <button class="btn ghost" id="mute" aria-pressed="true" hidden disabled>Mute</button>
            <button class="btn ghost" id="playDemo">Play Demo</button>
          </div>
        </div>
      </div>

      <section class="deck" id="deck" aria-live="polite" aria-label="Game cards"></section>

      <canvas id="confettiCanvas" aria-hidden="true"></canvas>

      <div style="width:100%;display:flex;align-items:center;justify-content:center">
        <button class="btn" id="restart-bottom">Restart Game</button>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-box" role="document">
      <h2 id="modalTitle"></h2>
      <div class="subtitle" id="modalMessage"></div>
      <div class="modal-stats" id="modalStats"></div>
      <div style="display:flex;gap:0.6rem;margin-top:1rem;justify-content:flex-end">
        <button class="btn ghost" id="closeModal">Close</button>
        <button class="btn" id="playAgain">Play Again</button>
      </div>
    </div>
  </div>


  <div class="modal-overlay" id="highScoresOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-box" role="document">
      <h2>High Scores</h2>
      <div class="subtitle">Best records per difficulty</div>
      <div class="modal-stats" style="display:block">
        <div id="highScoresContainer"></div>
      </div>
      <div style="display:flex;gap:0.6rem;margin-top:1rem;justify-content:flex-end">
        <button class="btn ghost" id="closeHighScores">Close</button>
      </div>
    </div>
  </div>

  <!-- ✅ Add your pause/resume logic in app.js -->
  <script src="src/js/app.js"></script>
<script src="../game-shell.js"></script></body>
</html>
