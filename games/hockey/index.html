<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Air Hockey</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee;color:#333;font:15px Arial,sans-serif}main{max-width:1040px;margin:28px auto;padding:0 18px}h1{font-size:24px;font-weight:400}canvas{display:block;background:#fff;width:100%;aspect-ratio:5/3;box-shadow:0 1px 3px #0002;touch-action:none}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:15px 4px}.score{font-size:22px;font-weight:bold}button{border:0;background:white;box-shadow:0 1px 3px #0002;padding:9px 14px;cursor:pointer}p{color:#777}
</style></head><body><main><h1>Air Hockey</h1><canvas id="rink" width="1000" height="600" aria-label="Air hockey rink"></canvas><div class="bar"><div>Use the arrow keys to move the left paddle.</div><div class="score"><span id="left">0</span> : <span id="right">0</span></div><button id="reset">Restart round</button></div><p>The computer watches your movement and tracks the puck on its side.</p></main><script>
const c=document.getElementById('rink'),g=c.getContext('2d'),keys=new Set(),L={x:160,y:300,vx:0,vy:0},R={x:840,y:300,vx:0,vy:0},P={x:500,y:300,vx:5,vy:2},rad=31,pr=14;let ls=0,rs=0,last=performance.now(),paused=false;document.addEventListener("gamehub:pause",e=>paused=e.detail.paused);document.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){keys.add(e.key);e.preventDefault()}});document.addEventListener('keyup',e=>keys.delete(e.key));document.getElementById('reset').onclick=()=>serve(Math.random()>.5?1:-1);function serve(d){P.x=500;P.y=180+Math.random()*240;P.vx=d*(4+Math.random()*3);P.vy=(Math.random()-.5)*5;L.x=160;L.y=300;R.x=840;R.y=300}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function hit(p){let dx=P.x-p.x,dy=P.y-p.y,d=Math.hypot(dx,dy);if(d>rad+pr||d===0)return;let nx=dx/d,ny=dy/d,rvx=P.vx-p.vx,rvy=P.vy-p.vy,impact=rvx*nx+rvy*ny;if(impact>=0)return;P.x=p.x+nx*(rad+pr+1);P.y=p.y+ny*(rad+pr+1);let impulse=-(1.84)*impact;P.vx+=impulse*nx+p.vx*.12;P.vy+=impulse*ny+p.vy*.12;let s=Math.hypot(P.vx,P.vy);if(s>14){P.vx*=14/s;P.vy*=14/s}}
function update(dt){if(paused)return;let step=dt/16.67,ox=L.x,oy=L.y;L.x=clamp(L.x+((keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0))*7*step,rad+12,500-rad);L.y=clamp(L.y+((keys.has('ArrowDown')?1:0)-(keys.has('ArrowUp')?1:0))*7*step,rad+12,600-rad-12);L.vx=(L.x-ox)/step;L.vy=(L.y-oy)/step;ox=R.x;oy=R.y;let targetX=clamp(P.x>500?Math.max(690,P.x+45):840,530,960),targetY=P.x>500?P.y:300;R.x=clamp(R.x+clamp(targetX-R.x,-4.5*step,4.5*step),530,960);R.y=clamp(R.y+clamp(targetY-R.y,-4.5*step,4.5*step),45,555);R.vx=(R.x-ox)/step;R.vy=(R.y-oy)/step;let substeps=Math.max(1,Math.ceil(Math.hypot(P.vx,P.vy)*step/8)),sub=step/substeps;for(let i=0;i<substeps;i++){P.x+=P.vx*sub;P.y+=P.vy*sub;if(P.y<pr){P.y=pr;P.vy=Math.abs(P.vy)}if(P.y>600-pr){P.y=600-pr;P.vy=-Math.abs(P.vy)}hit(L);hit(R)}P.vx*=Math.pow(.999,step);P.vy*=Math.pow(.999,step);if(P.y<pr){P.y=pr;P.vy=Math.abs(P.vy)}if(P.y>600-pr){P.y=600-pr;P.vy=-Math.abs(P.vy)}if(P.x<pr&&Math.abs(P.y-300)>86){P.x=pr;P.vx=Math.abs(P.vx)}if(P.x>1000-pr&&Math.abs(P.y-300)>86){P.x=1000-pr;P.vx=-Math.abs(P.vx)}hit(L);hit(R);if(P.x<-pr){rs++;document.getElementById('right').textContent=rs;serve(1)}if(P.x>1000+pr){ls++;document.getElementById('left').textContent=ls;serve(-1)}}
function draw(){g.fillStyle='#fff';g.fillRect(0,0,1000,600);g.strokeStyle='#d8e5e7';g.lineWidth=6;g.strokeRect(5,5,990,590);g.beginPath();g.moveTo(500,0);g.lineTo(500,600);g.stroke();g.beginPath();g.arc(500,300,100,0,Math.PI*2);g.stroke();for(let [x,col] of [[0,'#e75d61'],[1000,'#4f94c9']]){g.strokeStyle=col;g.lineWidth=9;g.beginPath();g.arc(x,300,87,-Math.PI/2,Math.PI/2);g.stroke()}function disc(p,r,col){g.fillStyle='#0002';g.beginPath();g.arc(p.x+4,p.y+5,r+1,0,7);g.fill();g.fillStyle=col;g.beginPath();g.arc(p.x,p.y,r,0,7);g.fill();g.strokeStyle='#fff8';g.lineWidth=5;g.beginPath();g.arc(p.x,p.y,r-8,0,7);g.stroke()}disc(L,rad,'#df6062');disc(R,rad,'#5595bf');disc(P,pr,'#30343b')}
function frame(t){let dt=Math.min(32,t-last);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script><script src="../game-shell.js"></script></body></html>
